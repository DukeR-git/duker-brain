name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: path handling (drive letters,
        # backslashes, rename semantics) is where the two platforms differ.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundled CLIs start
        run: |
          node dist/brain-traverse.mjs help
          node dist/brain-keeper.mjs help

  host-laya:
    name: host-laya (API layer, no GPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-laya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host-laya/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q
      - run: bash -n scripts/host_preflight.sh
      - name: Compose file is valid
        run: docker compose config --quiet
