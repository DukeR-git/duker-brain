version: 2
updates:
  # One grouped pull request per week for the npm workspace (all three packages).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # host-laya pins exact versions in constraints.txt, resolved together with the
  # torch XPU build. The Intel GPU runtime has to move as one unit with torch
  # (see the header of constraints.txt), so it is ignored here and upgraded by
  # hand. Everything else arrives as one grouped pull request, which still needs
  # a smoke test on real hardware before merging.
  - package-ecosystem: pip
    directory: /host-laya
    schedule:
      interval: monthly
    groups:
      host-laya-python:
        patterns: ["*"]
    ignore:
      - dependency-name: "torch*"
      - dependency-name: "triton-xpu"
      - dependency-name: "intel-*"
      - dependency-name: "onemkl-*"
      - dependency-name: "dpcpp-cpp-rt"
      - dependency-name: "mkl"
      - dependency-name: "tbb"
      - dependency-name: "tcmlib"
      - dependency-name: "umf"

  # The base image stays on the Ubuntu LTS the Intel GPU packages are built for.
  # Patch updates of that release still come through.
  - package-ecosystem: docker
    directory: /host-laya
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
