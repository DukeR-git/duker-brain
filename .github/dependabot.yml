version: 2
updates:
  # One grouped pull request per week for the npm workspace (all three packages).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # The Node types follow the oldest supported Node (engines.node), not the
      # newest release; newer majors type APIs that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

